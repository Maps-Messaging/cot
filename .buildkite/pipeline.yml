steps:
  - label: ":maven: Build and Deploy"
    checkout:
      ssh_secret: "GITHUB_SSH_KEY"
    command:
      - export SONAR_TOKEN=$(buildkite-agent secret get SONAR_TOKEN)
      - export NVD_API_KEY=$(buildkite-agent secret get nvd_api_key)
      - java -version
      - mvn -Dgpg.skip=true clean deploy -Psnapshot
      - mvn sonar:sonar -Psnapshot -Dsonar.login=$${SONAR_TOKEN}
    plugins:
      - test-collector#v1.0.0:
          files: "target/surefire-reports/*.xml"
          format: "junit"
    env:
      BUILDKITE_ANALYTICS_TOKEN: "$${BUILDKITE_ANALYTICS_TOKEN}"
    agents:
      queue: "java_build_queue_aws"
